<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Z-QUIZ V19 FINAL FULL</title>
<style>
:root{--bg:#FFFBEB;--card:#fff;--text:#1e293b;--border:#FDE68A;--primary:#1e293b}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
body{background:var(--bg);color:var(--text)}
#splash{position:fixed;inset:0;background:linear-gradient(135deg,#FFFBEB,#FDE68A);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:99999}
#splash.hide{display:none}
#app{max-width:460px;margin:0 auto;padding:14px}
.top{display:flex;justify-content:space-between;align-items:center;background:var(--card);padding:10px 14px;border-radius:14px;margin-bottom:12px}
.card{background:var(--card);padding:16px;border-radius:16px;margin-bottom:10px;cursor:pointer;text-align:center;font-weight:700;box-shadow:0 4px 15px rgba(0,0,0,.06)}
.card.dark{background:var(--primary);color:#fff}
.btn{width:100%;padding:13px;background:var(--primary);color:white;border:none;border-radius:12px;font-weight:800;margin-top:10px;cursor:pointer}
.opt{background:var(--bg);border:2px solid var(--border);padding:12px;border-radius:12px;margin-bottom:8px;cursor:pointer}
.opt.correct{background:#10b981;color:#fff}
.opt.wrong{background:#ef4444;color:#fff}
.q-card{background:var(--card);border-radius:18px;padding:18px}
input{width:100%;padding:12px;border-radius:10px;border:2px solid var(--border)}
.sel{border:2px solid var(--border);padding:10px;border-radius:12px;text-align:center;cursor:pointer;background:var(--card);font-weight:700}
.sel.active{background:var(--primary);color:#fff}
.flower{position:fixed;top:-20px;font-size:24px;animation:fall linear forwards;z-index:9999;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>

<div id="splash" onclick="this.classList.add('hide')">
<div style="font-size:60px;background:white;width:100px;height:100px;border-radius:50%;display:flex;justify-content:center;align-items:center">🧠</div>
<div style="margin-top:15px;font-weight:800;font-size:22px">WELCOME TO Z-QUIZ</div>
<div style="margin-top:8px;background:#1e293b;color:#FDE68A;padding:6px 18px;border-radius:20px;font-size:11px">V19 FINAL FULL PROJECT</div>
</div>

<div id="app">
<div class="top">
<b id="appTitle">Z-QUIZ</b>
<div style="display:flex;gap:6px;align-items:center">
<span id="coinD" style="background:#FEF3C7;padding:5px 10px;border-radius:20px;font-size:12px">🪙 0</span>
<span id="badgeD" style="background:#e2e8f0;padding:5px 10px;border-radius:20px;font-size:11px">Newbie</span>
<button onclick="toggleLang()" id="langBtn" style="border:none;background:#10b981;color:white;padding:6px 12px;border-radius:20px;font-size:12px">اردو ✓</button>
</div>
</div>

<div id="s_login">
<h2 style="text-align:center" id="t_name">اپنا نام لکھیں</h2>
<input id="userName" placeholder="SAMI">
<button onclick="goHome()" class="btn" id="t_cont">آگے بڑھیں →</button>
</div>

<div id="s_home" style="display:none">
<h2 style="text-align:center" id="t_class">کلاس منتخب کریں</h2>
<div style="margin-top:12px">
<div class="card" onclick="setClass('junior')" id="t_junior">🧒 کلاس 1-5</div>
<div class="card dark" onclick="setClass('senior')" id="t_senior">🎓 کلاس 6-10</div>
</div>
</div>

<div id="s_cat" style="display:none">
<h2 style="text-align:center" id="t_topic">موضوع</h2>
<div style="margin-top:12px">
<div class="card" onclick="setCat('islamic')" id="t_islamic">🕌 اسلامی</div>
<div class="card" onclick="setCat('math')" id="t_math">🔢 ریاضی</div>
<div class="card" onclick="setCat('english')" id="t_english">🔤 انگلش</div>
<div class="card" onclick="setCat('gk')" id="t_gk">🌍 جنرل نالج</div>
<div class="card dark" onclick="setCat('mix')" id="t_mix">✨ مکس</div>
</div>
</div>

<div id="s_timer" style="display:none">
<h2 style="text-align:center" id="t_timer">ٹائمر</h2>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px">
<div class="sel active" onclick="setTimer(20,this)" id="tt1">آسان<br>20s</div>
<div class="sel" onclick="setTimer(15,this)" id="tt2">میڈیم<br>15s</div>
<div class="sel" onclick="setTimer(10,this)" id="tt3">مشکل<br>10s</div>
</div>
<h2 style="text-align:center;margin-top:12px" id="t_qnum">کتنے سوال؟</h2>
<div id="numGroup" style="display:flex;gap:8px;justify-content:center;margin-top:8px">
<button class="sel" onclick="setNum(5,this)">5</button>
<button class="sel" onclick="setNum(10,this)">10</button>
<button class="sel" onclick="setNum(20,this)">20</button>
</div>
<button id="startBtn" onclick="startQuiz()" style="display:none" class="btn" id="t_start">شروع کریں →</button>
</div>

<div id="s_quiz" style="display:none">
<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px">
<span id="qCount">1/10</span><span>⏱ <b id="time">20</b>s</span>
</div>
<div class="q-card">
<div id="qText" style="font-weight:700;margin-bottom:10px"></div>
<div id="opts"></div>
<button id="nextBtn" onclick="nextQ()" style="display:none" class="btn" id="t_next">اگلا →</button>
</div>
</div>

<div id="s_result" style="display:none;text-align:center">
<h2 id="t_result">رزلٹ</h2>
<div style="background:white;border-radius:14px;padding:14px;margin-top:10px;text-align:left">
<p><span id="t_rname">نام</span>: <b id="rName"></b></p>
<p><span id="t_rscore">سکور</span>: <b id="rPerc"></b> | <b id="rCorrect"></b>/<b id="rTotal"></b></p>
<p>🪙 <span id="t_rcoins">کوائنز</span>: <b id="rCoins"></b> | <span id="rBadge"></span></p>
<p id="rMsg" style="text-align:center;font-weight:800;margin-top:8px"></p>
</div>
<canvas id="certCanvas" width="1200" height="750" style="width:100%;margin-top:12px;border-radius:16px"></canvas>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
<button onclick="downloadCert()" class="btn" style="background:#10b981" id="t_pdf">📜 PDF</button>
<button onclick="shareWA()" class="btn" style="background:#25D366" id="t_share">🟢 شیئر</button>
</div>
<button onclick="goHome()" class="btn" id="t_replay">دوبارہ کھیلیں</button>
</div>
</div>

<script>
let lang='ur',selClass='',selCat='',selNum=0,timerSec=20,curQs=[],cur=0,correct=0,timer,timeLeft,answered=false,userName='',coins=parseInt(localStorage.getItem('coins')||'0');
const T={
ur:{app:"Z-QUIZ",name:"اپنا نام لکھیں",cont:"آگے بڑھیں →",class:"کلاس منتخب کریں",junior:"🧒 کلاس 1 سے 5",senior:"🎓 کلاس 6 سے 10",topic:"موضوع منتخب کریں",islamic:"🕌 اسلامی",math:"🔢 ریاضی",english:"🔤 انگلش",gk:"🌍 جنرل نالج",mix:"✨ مکس",timer:"ٹائمر منتخب کریں",qnum:"کتنے سوال؟",start:"شروع کریں →",next:"اگلا →",result:"رزلٹ",rname:"نام",rscore:"سکور",rcoins:"کوائنز",replay:"دوبارہ کھیلیں",pdf:"📜 PDF ڈاؤن لوڈ",share:"🟢 شیئر",easy:"آسان",med:"میڈیم",hard:"مشکل",msg100:"ماشاءاللہ شاندار 🌟",msg70:"بہت خوب! پھولوں کی مبارک 🌸🎉",msg50:"بہت خوب 👏",msg0:"کوشش جاری رکھیں 💪"},
en:{app:"Z-QUIZ",name:"Enter Your Name",cont:"Continue →",class:"Select Class",junior:"🧒 Class 1-5",senior:"🎓 Class 6-10",topic:"Select Topic",islamic:"🕌 Islamic",math:"🔢 Math",english:"🔤 English",gk:"🌍 GK",mix:"✨ Mix All",timer:"Select Timer",qnum:"How many Qs?",start:"Start Quiz →",next:"Next →",result:"Result",rname:"Name",rscore:"Score",rcoins:"Coins",replay:"Play Again",pdf:"📜 Download PDF",share:"🟢 Share",easy:"Easy",med:"Medium",hard:"Hard",msg100:"MashaAllah Excellent 🌟",msg70:"Excellent! Flowers 🌸🎉",msg50:"Very Good 👏",msg0:"Keep Trying 💪"}
};

function genQs(){
let islamic=[],math=[],english=[],gk=[];
for(let i=1;i<=30;i++){
islamic.push({q_ur:"اسلامی سوال "+i+" - قرآن میں پارے؟",q_en:"Islamic Q "+i+" - Paras in Quran?",o_ur:["30","20","40","10"],o_en:["30","20","40","10"],a:0});
math.push({q_ur:"ریاضی "+i+" - "+i+" + "+i+" =؟",q_en:"Math "+i+" - "+i+"+"+i+"=?",o_ur:[String(i+i),String(i*2+1),String(i*3),String(i+10)],o_en:[String(i+i),String(i*2+1),String(i*3),String(i+10)],a:0});
english.push({q_ur:"انگلش "+i+" - Apple مطلب؟",q_en:"English "+i+" - Apple?",o_ur:["سیب","کیلا","آم","انار"],o_en:["Apple","Banana","Mango","Orange"],a:0});
gk.push({q_ur:"جنرل نالج "+i+" - پاکستان کا قومی جانور؟",q_en:"GK "+i+" - National animal PK?",o_ur:["مارخور","شیر","ہاتھی","گھوڑا"],o_en:["Markhor","Lion","Elephant","Horse"],a:0});
}
islamic[0]={q_ur:"اللہ کتنے ہیں؟",q_en:"How many Allah?",o_ur:["ایک","دو","تین","چار"],o_en:["One","Two","Three","Four"],a:0};
islamic[1]={q_ur:"ہمارے نبی ﷺ کا نام؟",q_en:"Prophet name?",o_ur:["محمد ﷺ","احمد","علی","عمر"],o_en:["Muhammad ﷺ","Ahmad","Ali","Umar"],a:0};
islamic[2]={q_ur:"قرآن کی پہلی سورت؟",q_en:"First Surah?",o_ur:["الفاتحہ","البقرہ","الناس","الاخلاص"],o_en:["Al-Fatiha","Baqarah","An-Nas","Ikhlas"],a:0};
math[0]={q_ur:"2+2=؟",q_en:"2+2=?",o_ur:["4","5","3","6"],o_en:["4","5","3","6"],a:0};
gk[0]={q_ur:"پاکستان کا دارالحکومت؟",q_en:"Capital of Pakistan?",o_ur:["اسلام آباد","لاہور","کراچی","پشاور"],o_en:["Islamabad","Lahore","Karachi","Peshawar"],a:0};
return {islamic,math,english,gk,mix:[].concat(islamic,math,english,gk)};
}
let DB={junior:genQs(),senior:genQs()};

function applyLang(){
let d=T[lang];
document.getElementById('appTitle').innerText=d.app;
document.getElementById('t_name').innerText=d.name;
document.getElementById('t_cont').innerText=d.cont;
document.getElementById('t_class').innerText=d.class;
document.getElementById('t_junior').innerText=d.junior;
document.getElementById('t_senior').innerText=d.senior;
document.getElementById('t_topic').innerText=d.topic;
document.getElementById('t_islamic').innerText=d.islamic;
document.getElementById('t_math').innerText=d.math;
document.getElementById('t_english').innerText=d.english;
document.getElementById('t_gk').innerText=d.gk;
document.getElementById('t_mix').innerText=d.mix;
document.getElementById('t_timer').innerText=d.timer;
document.getElementById('t_qnum').innerText=d.qnum;
document.getElementById('t_start').innerText=d.start;
document.getElementById('t_next').innerText=d.next;
document.getElementById('t_result').innerText=d.result;
document.getElementById('t_rname').innerText=d.rname;
document.getElementById('t_rscore').innerText=d.rscore;
document.getElementById('t_rcoins').innerText=d.rcoins;
document.getElementById('t_replay').innerText=d.replay;
document.getElementById('t_pdf').innerText=d.pdf;
document.getElementById('t_share').innerText=d.share;
document.getElementById('tt1').innerHTML=d.easy+'<br>20s';
document.getElementById('tt2').innerHTML=d.med+'<br>15s';
document.getElementById('tt3').innerHTML=d.hard+'<br>10s';
document.getElementById('langBtn').innerText=lang==='ur'?'اردو ✓':'English ✓';
}
function toggleLang(){lang=lang==='ur'?'en':'ur';applyLang();if(curQs.length>0)loadQ();}
function updateTop(){document.getElementById('coinD').innerText='🪙 '+coins;let b='Newbie';if(coins>=100)b='🔥 PRO';document.getElementById('badgeD').innerText=b;}
function hideAll(){['s_login','s_home','s_cat','s_timer','s_quiz','s_result'].forEach(id=>document.getElementById(id).style.display='none');}
function goHome(){hideAll();let n=document.getElementById('userName').value.trim();if(n)userName=n;if(!userName){document.getElementById('s_login').style.display='block';return;}document.getElementById('s_home').style.display='block';}
function setClass(c){selClass=c;hideAll();document.getElementById('s_cat').style.display='block';}
function setCat(c){selCat=c;hideAll();document.getElementById('s_timer').style.display='block';}
function setTimer(s,el){timerSec=s;document.getElementById('tt1').classList.remove('active');document.getElementById('tt2').classList.remove('active');document.getElementById('tt3').classList.remove('active');el.classList.add('active');}
function setNum(n,el){selNum=n;document.querySelectorAll('#numGroup .sel').forEach(e=>e.classList.remove('active'));el.classList.add('active');document.getElementById('startBtn').style.display='block';}
function startQuiz(){let pool=[].concat(DB[selClass][selCat]);pool.sort(()=>0.5-Math.random());curQs=pool.slice(0,selNum);cur=0;correct=0;hideAll();document.getElementById('s_quiz').style.display='block';loadQ();}
function loadQ(){answered=false;timeLeft=timerSec;document.getElementById('time').innerText=timeLeft;document.getElementById('qCount').innerText=(cur+1)+'/'+curQs.length;let q=curQs[cur];document.getElementById('qText').innerText=lang==='ur'?q.q_ur:q.q_en;let div=document.getElementById('opts');div.innerHTML='';let opts=lang==='ur'?q.o_ur:q.o_en;opts.forEach((o,i)=>{div.innerHTML+=`<div class="opt" onclick="checkAns(${i})">${o}</div>`});document.getElementById('nextBtn').style.display='none';clearInterval(timer);timer=setInterval(()=>{timeLeft--;document.getElementById('time').innerText=timeLeft;if(timeLeft<=0){clearInterval(timer);checkAns(-1);}},1000);}
function checkAns(i){if(answered)return;answered=true;clearInterval(timer);document.querySelectorAll('.opt').forEach((e,idx)=>{if(idx==curQs[cur].a)e.classList.add('correct');if(idx==i&&idx!=curQs[cur].a)e.classList.add('wrong');});if(i==curQs[cur].a)correct++;document.getElementById('nextBtn').style.display='block';}
function nextQ(){cur++;if(cur>=curQs.length)showRes();else loadQ();}
function setResultMsg(p){let d=T[lang];let el=document.getElementById('rMsg');if(p>=100)el.innerText=d.msg100;else if(p>=70)el.innerText=d.msg70;else if(p>=50)el.innerText=d.msg50;else el.innerText=d.msg0;}
function showRes(){hideAll();document.getElementById('s_result').style.display='block';let e=correct*10;coins+=e;localStorage.setItem('coins',coins);updateTop();document.getElementById('rName').innerText=userName;document.getElementById('rTotal').innerText=curQs.length;document.getElementById('rCorrect').innerText=correct;document.getElementById('rCoins').innerText='+'+e;document.getElementById('rBadge').innerText=document.getElementById('badgeD').innerText;let perc=Math.round(correct/curQs.length*100);document.getElementById('rPerc').innerText=perc+'%';setResultMsg(perc);makeCert();if(perc>=70)launchFlowers();}
function launchFlowers(){for(let i=0;i<40;i++){setTimeout(()=>{let f=document.createElement('div');f.className='flower';let fl=['🌸','🌺','🌼','✨','🎉','💐'];f.innerText=fl[Math.floor(Math.random()*fl.length)];f.style.left=Math.random()*100+'vw';f.style.animationDuration=(2+Math.random()*3)+'s';document.body.appendChild(f);setTimeout(()=>f.remove(),4000);},i*80);}}
function makeCert(){let c=document.getElementById('certCanvas');let ctx=c.getContext('2d');let p=document.getElementById('rPerc').innerText;ctx.fillStyle='#FFFBEB';ctx.fillRect(0,0,1200,750);ctx.fillStyle='#fff';ctx.fillRect(18,18,1164,714);ctx.strokeStyle='#B45309';ctx.lineWidth=8;ctx.strokeRect(12,12,1176,726);ctx.fillStyle='#1e293b';ctx.font='bold 48px sans-serif';ctx.textAlign='center';ctx.fillText('CERTIFICATE',600,150);ctx.fillStyle='#d97706';ctx.font='20px sans-serif';ctx.fillText('Z-QUIZ V19 - MADE BY ZOHAIB',600,185);ctx.fillStyle='#1e293b';ctx.font='24px sans-serif';ctx.fillText(userName+' - '+p,600,260);}}
function downloadCert(){let cv=document.getElementById('certCanvas');let a=document.createElement('a');a.download='Z-QUIZ-'+userName+'.png';a.href=cv.toDataURL();a.click();}
function shareWA(){let p=document.getElementById('rPerc').innerText;let t='*Z-QUIZ Result*%0A'+userName+' - '+p+'%0Ahttps://zabi32300.github.io/Z-QUIZ-/';window.open('https://wa.me/?text='+t,'_blank');}
updateTop();applyLang();
setTimeout(()=>{let s=document.getElementById('splash');if(s)s.classList.add('hide');},1500);
</script>
</body>
</html>
