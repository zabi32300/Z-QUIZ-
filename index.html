<!DOCTYPE html>
<html lang="ur" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<title>Z-QUIZ - Made by Zohaib</title>
<style>
  :root {
    --bg: #FFFBEB;
    --card: #fff;
    --text: #1e293b;
    --border: #FDE68A;
    --primary: #1e293b;
  }
    * { margin:0; padding:0; box-sizing:border-box; font-family: system-ui, sans-serif; }
  body { background: var(--bg); color: var(--text); }
  
  /* FIX - CSS auto hide after 1.6s */
  #splash {
    position: fixed; inset: 0;
    background: #FFFBEB;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    z-index: 99999;
    animation: autoHide 0.6s forwards;
    animation-delay: 1.6s;
  }
  @keyframes autoHide {
    to { transform: translateY(-100%); opacity:0; visibility:hidden; }
  }
  #splash.hide {
    transform: translateY(-100%);
    opacity:0;
    visibility:hidden;
    transition: 0.5s;
  }
  #app { max-width: 460px; margin: 0 auto; padding: 14px; }
  .top {
    display:flex; justify-content:space-between; align-items:center;
    background: var(--card); padding:10px 14px;
    border-radius:14px; box-shadow:0 4px 15px rgba(0,0,0,.06);
    margin-bottom:12px;
  }
  .card {
    background: var(--card); padding:16px; border-radius:16px;
    margin-bottom:10px; cursor:pointer;
    box-shadow:0 4px 15px rgba(0,0,0,.06);
    text-align:center; font-weight:700;
  }
  .card.dark { background: var(--primary); color:#fff; }
  .btn {
    width:100%; padding:13px; background:var(--primary);
    color:white; border:none; border-radius:12px;
    font-weight:800; margin-top:10px; cursor:pointer;
  }
  .opt {
    background: var(--bg); border:2px solid var(--border);
    padding:12px; border-radius:12px; margin-bottom:8px; cursor:pointer;
  }
  .opt.correct { background:#10b981; color:#fff; }
  .opt.wrong { background:#ef4444; color:#fff; }
  .q-card { background:var(--card); border-radius:18px; padding:18px; box-shadow:0 8px 25px rgba(0,0,0,.07); }
  input { width:100%; padding:12px; border-radius:10px; border:2px solid var(--border); }
  .sel {
    border:2px solid var(--border); padding:10px;
    border-radius:12px; text-align:center;
    cursor:pointer; background:var(--card); font-weight:700;
  }
  .sel.active { background:var(--primary); color:#fff; }
</style>
</head>
<body>

<div id="splash" onclick="this.classList.add('hide')">
  <div style="font-size:60px;background:white;width:100px;height:100px;border-radius:50%;display:flex;justify-content:center;align-items:center;box-shadow:0 10px 20px rgba(0,0,0,.1)">🧠</div>
  <div style="margin-top:15px;font-weight:800;font-size:22px">WELCOME TO Z-QUIZ</div>
  <div style="margin-top:8px;background:#1e293b;color:#FDE68A;padding:6px 18px;border-radius:20px;font-size:11px">MADE BY ZOHAIB - FIXED</div>
</div>

<div id="app">
  <div class="top">
    <b>Z-QUIZ FIXED</b>
    <div style="display:flex;gap:6px;align-items:center">
      <span id="coinD" style="background:#FEF3C7;padding:5px 10px;border-radius:20px;font-size:12px;font-weight:800">🪙 0</span>
      <span id="badgeD" style="background:#e2e8f0;padding:5px 10px;border-radius:20px;font-size:11px;font-weight:800">Newbie</span>
      <button onclick="toggleLang()" id="langBtn" style="border:none;background:#1e293b;color:white;padding:6px 10px;border-radius:20px;font-size:11px">English</button>
    </div>
  </div>

  <div id="s_login">
    <h2 style="text-align:center" id="t_name">اپنا نام لکھیں</h2>
    <input id="userName" placeholder="Zohaib">
    <button onclick="goHome()" class="btn" id="t_cont">آگے بڑھیں →</button>
  </div>

  <div id="s_home" style="display:none">
    <h2 style="text-align:center" id="t_class">کلاس منتخب کریں</h2>
    <div style="margin-top:12px">
      <div class="card" onclick="setClass('junior')" id="t_junior">🧒 کلاس 1-5</div>
      <div class="card dark" onclick="setClass('senior')" id="t_senior">🎓 کلاس 6-10</div>
    </div>
  </div>

  <div id="s_cat" style="display:none">
    <h2 style="text-align:center" id="t_topic">موضوع</h2>
    <div style="margin-top:12px">
      <div class="card" onclick="setCat('islamic')" id="t_islamic">🕌 اسلامی</div>
      <div class="card" onclick="setCat('math')" id="t_math">🔢 ریاضی</div>
      <div class="card" onclick="setCat('english')" id="t_english">🔤 انگلش</div>
      <div class="card" onclick="setCat('gk')" id="t_gk">🌍 جنرل نالج</div>
      <div class="card dark" onclick="setCat('mix')" id="t_mix">✨ مکس</div>
    </div>
  </div>

  <div id="s_timer" style="display:none">
    <h2 style="text-align:center" id="t_timer">ٹائمر</h2>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px">
      <div class="sel active" onclick="setTimer(20,this)" id="tt1">آسان<br>20s</div>
      <div class="sel" onclick="setTimer(15,this)" id="tt2">میڈیم<br>15s</div>
      <div class="sel" onclick="setTimer(10,this)" id="tt3">مشکل<br>10s</div>
    </div>
    <h2 style="text-align:center;margin-top:12px" id="t_qnum">کتنے سوال؟</h2>
    <div style="display:flex;gap:8px;justify-content:center;margin-top:8px">
      <button class="sel" onclick="setNum(5)">5</button>
      <button class="sel" onclick="setNum(10)">10</button>
      <button class="sel" onclick="setNum(20)">20</button>
    </div>
    <button id="startBtn" onclick="startQuiz()" style="display:none" class="btn" id="t_start">شروع کریں →</button>
  </div>

  <div id="s_quiz" style="display:none">
    <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px">
      <span id="qCount">1/5</span>
      <span>⏱ <b id="time">20</b>s</span>
    </div>
    <div class="q-card">
      <div id="qText" style="font-weight:700;margin-bottom:10px;font-size:17px"></div>
      <div id="opts"></div>
      <button id="nextBtn" onclick="nextQ()" style="display:none" class="btn" id="t_next">اگلا →</button>
    </div>
  </div>

  <div id="s_result" style="display:none;text-align:center">
    <h2 id="t_result">رزلٹ</h2>
    <div style="background:white;border-radius:14px;padding:14px;margin-top:10px;text-align:left">
      <p><span id="t_rname">نام</span>: <b id="rName"></b></p>
      <p>Score: <b id="rPerc"></b> | <b id="rCorrect"></b>/<b id="rTotal"></b></p>
      <p>🪙 Coins: <b id="rCoins"></b> | <span id="rBadge"></span></p>
      <p id="rMsg" style="text-align:center;font-weight:700;margin-top:6px"></p>
    </div>
    <button onclick="goHome()" class="btn">دوبارہ کھیلیں</button>
  </div>

</div>

<script>
  // Double safety
  setTimeout(function(){
    var s = document.getElementById('splash');
    if(s) s.classList.add('hide');
  }, 1600);

  let lang = 'ur';
  let selClass = '';
  let selCat = '';
  let selNum = 5;
  let timerSec = 20;
  let curQs = [];
  let cur = 0;
  let correct = 0;
  let timer;
  let timeLeft;
  let answered = false;
  let userName = '';
  let coins = parseInt(localStorage.getItem('coins') || '0');

  const T = {
    ur: {
      name:"اپنا نام لکھیں", cont:"آگے بڑھیں →",
      class:"کلاس منتخب کریں",
      junior:"🧒 کلاس 1 سے 5 - آسان",
      senior:"🎓 کلاس 6 سے 10 - مشکل",
      topic:"موضوع منتخب کریں",
      islamic:"🕌 اسلامی", math:"🔢 ریاضی",
      english:"🔤 انگلش", gk:"🌍 جنرل نالج", mix:"✨ مکس سب کچھ",
      timer:"ٹائمر منتخب کریں", qnum:"کتنے سوال؟",
      start:"شروع کریں →", next:"اگلا →",
      result:"رزلٹ", rname:"نام",
      easy:"آسان", med:"میڈیم", hard:"مشکل"
    },
    en: {
      name:"Enter Your Name", cont:"Continue →",
      class:"Select Class",
      junior:"🧒 Class 1-5 Easy",
      senior:"🎓 Class 6-10 Hard",
      topic:"Select Topic",
      islamic:"🕌 Islamic", math:"🔢 Math",
      english:"🔤 English", gk:"🌍 GK", mix:"✨ Mix All",
      timer:"Select Timer", qnum:"How many Qs?",
      start:"Start Quiz →", next:"Next →",
      result:"Result", rname:"Name",
      easy:"Easy", med:"Medium", hard:"Hard"
    }
  };

  let DB = {
    junior: {
      islamic: [
        {q_ur:"اللہ کتنے ہیں؟", q_en:"How many Allah?", o_ur:["ایک","دو"], o_en:["One","Two"], a:0},
        {q_ur:"کعبہ کہاں ہے؟", q_en:"Where is Kaaba?", o_ur:["مکہ","مدینہ"], o_en:["Makkah","Madina"], a:0}
      ],
      math: [
        {q_ur:"2+2=؟", q_en:"2+2=?", o_ur:["3","4"], o_en:["3","4"], a:1}
      ],
      english: [
        {q_ur:"A کس کے لیے؟", q_en:"A for?", o_ur:["سیب","گیند"], o_en:["Apple","Ball"], a:0}
      ],
      gk: [
        {q_ur:"ہم کہاں رہتے ہیں؟", q_en:"We live in?", o_ur:["پاکستان","انڈیا"], o_en:["Pakistan","India"], a:0}
      ]
    },
    senior: {
      islamic: [
        {q_ur:"غزوہ بدر کب ہوئی؟", q_en:"When Battle of Badr?", o_ur:["2 ہجری","3 ہجری"], o_en:["2 Hijri","3 Hijri"], a:0}
      ],
      math: [
        {q_ur:"12x12=؟", q_en:"12x12=?", o_ur:["144","124"], o_en:["144","124"], a:0}
      ],
      english: [
        {q_ur:"Go کا ماضی؟", q_en:"Past of Go?", o_ur:["Went","Gone"], o_en:["Went","Gone"], a:0}
      ],
      gk: [
        {q_ur:"پاکستان کا دارالحکومت؟", q_en:"Capital?", o_ur:["اسلام آباد","لاہور"], o_en:["Islamabad","Lahore"], a:0}
      ]
    }
  };
  DB.junior.mix = [...DB.junior.islamic, ...DB.junior.math, ...DB.junior.english, ...DB.junior.gk];
  DB.senior.mix = [...DB.senior.islamic, ...DB.senior.math, ...DB.senior.english, ...DB.senior.gk];

  function applyLang(){
    let d = T[lang];
    document.getElementById('t_name').innerText = d.name;
    document.getElementById('t_cont').innerText = d.cont;
    document.getElementById('t_class').innerText = d.class;
    document.getElementById('t_junior').innerText = d.junior;
    document.getElementById('t_senior').innerText = d.senior;
    document.getElementById('t_topic').innerText = d.topic;
    document.getElementById('t_islamic').innerText = d.islamic;
    document.getElementById('t_math').innerText = d.math;
    document.getElementById('t_english').innerText = d.english;
    document.getElementById('t_gk').innerText = d.gk;
    document.getElementById('t_mix').innerText = d.mix;
    document.getElementById('t_timer').innerText = d.timer;
    document.getElementById('t_qnum').innerText = d.qnum;
    document.getElementById('t_start').innerText = d.start;
    document.getElementById('t_next').innerText = d.next;
    document.getElementById('t_result').innerText = d.result;
    document.getElementById('t_rname').innerText = d.rname;
    document.getElementById('tt1').innerHTML = d.easy + '<br>20s';
    document.getElementById('tt2').innerHTML = d.med + '<br>15s';
    document.getElementById('tt3').innerHTML = d.hard + '<br>10s';
    document.getElementById('langBtn').innerText = lang === 'ur' ? 'English' : 'اردو';
  }

  function toggleLang(){
    lang = lang === 'ur' ? 'en' : 'ur';
    applyLang();
    updateTop();
    if(curQs.length) loadQ();
  }

  function updateTop(){
    document.getElementById('coinD').innerText = '🪙 ' + coins;
    let badge = 'Newbie';
    if(coins >= 100) badge = '🔥 PRO';
    document.getElementById('badgeD').innerText = badge;
  }

  function hideAll(){
    ['s_login','s_home','s_cat','s_timer','s_quiz','s_result'].forEach(id => {
      document.getElementById(id).style.display = 'none';
    });
  }

  function goHome(){
    hideAll();
    let n = document.getElementById('userName').value.trim();
    if(n) userName = n;
    if(!userName){
      document.getElementById('s_login').style.display = 'block';
      return;
    }
    document.getElementById('s_home').style.display = 'block';
  }

  function setClass(c){
    selClass = c;
    hideAll();
    document.getElementById('s_cat').style.display = 'block';
  }

  function setCat(c){
    selCat = c;
    hideAll();
    document.getElementById('s_timer').style.display = 'block';
  }

  function setTimer(s, el){
    timerSec = s;
    document.querySelectorAll('#s_timer .sel').forEach((e,i)=>{
      if(i<3) e.classList.remove('active');
    });
    el.classList.add('active');
  }

  function setNum(n){
    selNum = n;
    document.getElementById('startBtn').style.display = 'block';
  }

  function startQuiz(){
    let pool = [...DB[selClass][selCat]];
    pool.sort(()=> 0.5 - Math.random());
    curQs = pool.slice(0, Math.min(selNum, pool.length));
    cur = 0;
    correct = 0;
    hideAll();
    document.getElementById('s_quiz').style.display = 'block';
    loadQ();
  }

  function loadQ(){
    answered = false;
    timeLeft = timerSec;
    document.getElementById('time').innerText = timeLeft;
    document.getElementById('qCount').innerText = (cur+1) + '/' + curQs.length;
    let q = curQs[cur];
    document.getElementById('qText').innerText = lang === 'ur' ? q.q_ur : q.q_en;
    let div = document.getElementById('opts');
    div.innerHTML = '';
    let opts = lang === 'ur' ? q.o_ur : q.o_en;
    opts.forEach((o,i)=>{
      div.innerHTML += '<div class="opt" onclick="checkAns('+i+')">'+o+'</div>';
    });
    document.getElementById('nextBtn').style.display = 'none';
    clearInterval(timer);
    timer = setInterval(()=>{
      timeLeft--;
      document.getElementById('time').innerText = timeLeft;
      if(timeLeft <= 0){
        clearInterval(timer);
        checkAns(-1);
      }
    },1000);
  }

  function checkAns(i){
    if(answered) return;
    answered = true;
    clearInterval(timer);
    let els = document.querySelectorAll('.opt');
    els.forEach((e,idx)=>{
      if(idx == curQs[cur].a) e.classList.add('correct');
      if(idx == i && idx != curQs[cur].a) e.classList.add('wrong');
    });
    if(i == curQs[cur].a) correct++;
    document.getElementById('nextBtn').style.display = 'block';
  }

  function nextQ(){
    cur++;
    if(cur >= curQs.length){
      showRes();
    }else{
      loadQ();
    }
  }

  function showRes(){
    hideAll();
    document.getElementById('s_result').style.display = 'block';
    let earned = correct * 10;
    coins += earned;
    localStorage.setItem('coins', coins);
    updateTop();
    document.getElementById('rName').innerText = userName || 'Player';
    document.getElementById('rTotal').innerText = curQs.length;
    document.getElementById('rCorrect').innerText = correct;
    document.getElementById('rCoins').innerText = '+' + earned;
    document.getElementById('rBadge').innerText = document.getElementById('badgeD').innerText;
    document.getElementById('rPerc').innerText = Math.round(correct/curQs.length*100) + '%';
    document.getElementById('rMsg').innerText = correct == curQs.length ? 'ماشاءاللہ شاندار 🌟' : 'بہت خوب 👏';
  }

  updateTop();
  applyLang();
</script>

</body>
</html>
